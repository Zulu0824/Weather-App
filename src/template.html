<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zulu's Weather App</title>
  </head>
  <body>
    <div id="container">
      <div id="header-section">
        <div id="logo-heading">
          <svg
            id="logo-icon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 -960 960 960"
          >
            <path
              d="M260-160q-91 0-155.5-63T40-377q0-78 47-139t123-78q25-92 100-149t170-57q117 0 198.5 81.5T760-520q69 8 114.5 59.5T920-340q0 75-52.5 127.5T740-160H260Zm0-80h480q42 0 71-29t29-71q0-42-29-71t-71-29h-60v-80q0-83-58.5-141.5T480-720q-83 0-141.5 58.5T280-520h-20q-58 0-99 41t-41 99q0 58 41 99t99 41Zm220-240Z"
            />
          </svg>
          <h1>Weather App</h1>
        </div>
        <div id="search-section">
          <input
            type="search"
            id="search-bar"
            name="search-bar"
            placeholder="New York"
          />
        </div>
        <div id="icon-div">
          <button type="button" id="search-button">
            <svg
              id="search-icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 -960 960 960"
            >
              <path
                d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z"
              />
            </svg>
          </button>
        </div>
      </div>
      <div id="main-content">
        <div id="app-container">
          <h3 id="weather-location">Location</h3>
          <div id="temperature-box">
            <h4>Temperature</h4>
            <p id="temp-high">High</p>
            <p id="temp-low">Low</p>
          </div>
          <div id="humidity-box">
            <h4>Humidity</h4>
            <p id="weather-humidity">%</p>
          </div>
          <div id="desc-box">
            <h4>Weather Description</h4>
            <p id="weather-description"></p>
          </div>
          <div id="windspeed-box">
            <h4>Windspeed</h4>
            <p id="weather-windspeed">m/s</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
